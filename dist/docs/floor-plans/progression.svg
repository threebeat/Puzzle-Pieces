<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="1200" height="950"><rect width="1200" height="950" fill="#f2f0e6"/><g font-family="Arial,sans-serif" fill="#304b3c"><text x="45" y="60" font-family="Georgia,serif" font-size="35">The first visit</text><text x="45" y="91" font-size="13">All open routes are reversible. No puzzle completion is required in this milestone.</text><rect x="440" y="130" width="320" height="70" rx="4" fill="#d7dfce" stroke="#7d967b" /><text x="600" y="159" text-anchor="middle" font-size="15">Enter the museum</text><text x="600" y="181" text-anchor="middle" font-size="11" fill="#75846d">Ground floor / the southern hall</text><path d="M600 200V220H600V240" fill="none" stroke="#7c9677" stroke-width="2" /><rect x="440" y="240" width="320" height="70" rx="4" fill="#d7dfce" stroke="#7d967b" /><text x="600" y="269" text-anchor="middle" font-size="15">The Main Hall</text><text x="600" y="291" text-anchor="middle" font-size="11" fill="#75846d">Information booth → wire → lamp</text><path d="M600 310V347.5H165V385" fill="none" stroke="#7c9677" stroke-width="2" /><rect x="35" y="385" width="260" height="70" rx="4" fill="#d7dfce" stroke="#7d967b" /><text x="165" y="414" text-anchor="middle" font-size="15">Northern Arcade</text><text x="165" y="436" text-anchor="middle" font-size="11" fill="#75846d">01 / Hidden Operators + café</text><path d="M600 310V347.5H455V385" fill="none" stroke="#7c9677" stroke-width="2" /><rect x="325" y="385" width="260" height="70" rx="4" fill="#d7dfce" stroke="#7d967b" /><text x="455" y="414" text-anchor="middle" font-size="15">Days of Rebirth</text><text x="455" y="436" text-anchor="middle" font-size="11" fill="#75846d">02 / first room</text><path d="M600 310V347.5H745V385" fill="none" stroke="#7c9677" stroke-width="2" /><rect x="615" y="385" width="260" height="70" rx="4" fill="#d7dfce" stroke="#7d967b" /><text x="745" y="414" text-anchor="middle" font-size="15">Southern Arcade</text><text x="745" y="436" text-anchor="middle" font-size="11" fill="#75846d">Shop + elevators + staff threshold</text><path d="M600 310V347.5H1035V385" fill="none" stroke="#7c9677" stroke-width="2" /><rect x="905" y="385" width="260" height="70" rx="4" fill="#d7dfce" stroke="#7d967b" /><text x="1035" y="414" text-anchor="middle" font-size="15">Public stair</text><text x="1035" y="436" text-anchor="middle" font-size="11" fill="#75846d">West mezzanine only</text><path d="M165 455V472.5H165V490" fill="none" stroke="#7c9677" stroke-width="2" /><rect x="35" y="490" width="260" height="70" rx="4" fill="#d7dfce" stroke="#7d967b" /><text x="165" y="519" text-anchor="middle" font-size="15">1.01 / boxy gallery</text><text x="165" y="541" text-anchor="middle" font-size="11" fill="#75846d">Open / no works installed</text><path d="M165 560V577.5H165V595" fill="none" stroke="#7c9677" stroke-width="2" /><rect x="35" y="595" width="260" height="70" rx="4" fill="#d7dfce" stroke="#7d967b" /><text x="165" y="624" text-anchor="middle" font-size="15">1.02 / hallway gallery</text><text x="165" y="646" text-anchor="middle" font-size="11" fill="#75846d">Open / no works installed</text><path d="M165 665V682.5H165V700" fill="none" stroke="#7c9677" stroke-width="2" /><rect x="35" y="700" width="260" height="70" rx="4" fill="#d7dfce" stroke="#7d967b" /><text x="165" y="729" text-anchor="middle" font-size="15">1.03 / large gallery</text><text x="165" y="751" text-anchor="middle" font-size="11" fill="#75846d">Open / no works installed</text><rect x="325" y="490" width="260" height="70" rx="4" fill="#d7dfce" stroke="#7d967b" /><text x="455" y="519" text-anchor="middle" font-size="15">2.01 / rectangular gallery</text><text x="455" y="541" text-anchor="middle" font-size="11" fill="#75846d">Open / no works installed</text><path d="M455 455V472.5H455V490" fill="none" stroke="#7c9677" stroke-width="2" /><rect x="615" y="490" width="260" height="70" rx="4" fill="#d7dfce" stroke="#7d967b" /><text x="745" y="519" text-anchor="middle" font-size="15">Gift shop</text><text x="745" y="541" text-anchor="middle" font-size="11" fill="#75846d">Open shell / windows into hall</text><path d="M745 455V472.5H745V490" fill="none" stroke="#7c9677" stroke-width="2" /><rect x="615" y="595" width="260" height="70" rx="4" fill="#e0dacb" stroke="#b1987d" stroke-dasharray="6 4"/><text x="745" y="624" text-anchor="middle" font-size="15">Security hall + elevators</text><text x="745" y="646" text-anchor="middle" font-size="11" fill="#75846d">Locked / inactive</text><path d="M745 560V577.5H745V595" fill="none" stroke="#b39a7f" stroke-width="2" stroke-dasharray="5 5"/><rect x="905" y="490" width="260" height="70" rx="4" fill="#d7dfce" stroke="#7d967b" /><text x="1035" y="519" text-anchor="middle" font-size="15">Cross/Hatch / 3.01</text><text x="1035" y="541" text-anchor="middle" font-size="11" fill="#75846d">Large gallery / display walls</text><path d="M1035 455V472.5H1035V490" fill="none" stroke="#7c9677" stroke-width="2" /><rect x="905" y="595" width="260" height="70" rx="4" fill="#e0dacb" stroke="#b1987d" stroke-dasharray="6 4"/><text x="1035" y="624" text-anchor="middle" font-size="15">East mezzanine</text><text x="1035" y="646" text-anchor="middle" font-size="11" fill="#75846d">Closed / no bridge</text><path d="M1035 560V577.5H1035V595" fill="none" stroke="#b39a7f" stroke-width="2" stroke-dasharray="5 5"/><rect x="325" y="700" width="260" height="70" rx="4" fill="#e0dacb" stroke="#b1987d" stroke-dasharray="6 4"/><text x="455" y="729" text-anchor="middle" font-size="15">Eastern Arcade</text><text x="455" y="751" text-anchor="middle" font-size="11" fill="#75846d">Visible from hall / locked</text><text x="325" y="620" font-size="12">Café is opposite Hidden Operators.</text><text x="325" y="644" font-size="12">The northern arcade holds the map.</text><path d="M45 830H1155" stroke="#b4bda9"/><text x="45" y="868" font-size="12">Solid paths = available travel. Dashed boundaries = later development, not hidden objectives.</text><text x="45" y="896" font-size="12">The empty galleries can be visited in any order. Return to the main hall at any time.</text></g></svg>