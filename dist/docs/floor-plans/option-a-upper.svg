<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1390" viewBox="0 0 1200 1390"><title>Puzzle Pieces — Option A, mezzanine</title><desc>North is up. The hall axis tilts twelve degrees east of north. Open gallery shells are green, closed routes are hatched, future growth is dashed.</desc><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#dddcd0"/><path d="M0 0V8" stroke="#b2b7a8" stroke-width="2"/></pattern></defs><rect width="1200" height="1390" fill="#f2f0e6"/><g font-family="Arial,sans-serif" fill="#304b3c"><text x="55" y="65" font-size="17" letter-spacing="4">PUZZLE PIECES / DESIGN NOTEBOOK</text><text x="55" y="112" font-family="Georgia,serif" font-size="35">The west mezzanine</text><text x="55" y="147" font-size="13" letter-spacing="1.2">OPTION A — THE AXIAL MUSEUM · IMPLEMENTED</text><path d="M55 172H1145" stroke="#aeb8a4"/><path d="M1100 290V207l-10 20m10-20 10 20" stroke="#304b3c" stroke-width="2" fill="none"/><text x="1100" y="198" text-anchor="middle" font-size="14">N</text><text x="1080" y="317" text-anchor="middle" font-size="10">TRUE NORTH</text><g transform="rotate(12 600 660)"><rect x="609" y="489" width="180" height="504" fill="#e6e5da" stroke="#a8b19f" stroke-width="2" stroke-dasharray="6 5"/><g transform="rotate(-12 699 741)" fill="#8f9b88" font-size="14" text-anchor="middle"><text x="699" y="724">OPEN TO</text><text x="699" y="741">MAIN HALL</text><text x="699" y="758">BELOW</text></g><rect x="303" y="615" width="288" height="81" fill="none" stroke="#91a18b" stroke-width="1.5" stroke-dasharray="6 5"/><g transform="rotate(-12 447 655.5)" fill="#7c9076" font-size="9" text-anchor="middle"><text x="447" y="655.5">UPPER GALLERY RESERVE</text></g><rect x="609" y="507" width="36" height="486" fill="#d2d9c6" stroke="#59745d" stroke-width="2" /><g transform="rotate(-12 627 633)" fill="#304b3c" font-size="10" text-anchor="middle"><text x="627" y="624.5">WEST</text><text x="627" y="641.5">OPEN</text></g><rect x="753" y="507" width="36" height="486" fill="url(#hatch)" stroke="#59745d" stroke-width="2" /><g transform="rotate(-12 771 633)" fill="#304b3c" font-size="10" text-anchor="middle"><text x="771" y="624.5">EAST</text><text x="771" y="641.5">CLOSED</text></g><rect x="357" y="705" width="252" height="198" fill="#becbd1" stroke="#59745d" stroke-width="2" /><g transform="rotate(-12 483 804)" fill="#304b3c" font-size="11" text-anchor="middle"><text x="483" y="787">CROSS/HATCH</text><text x="483" y="804">3.01 / ROOM 01</text><text x="483" y="821">28 × 22 m</text></g><path d="M609 813L609 849" stroke="#f2f0e6" stroke-width="7"/><rect x="612.6" y="876" width="34.199999999999996" height="99" fill="#ceccb9" stroke="#59745d" stroke-width="2" /><path d="M612.6 876H646.8" stroke="#8c947c"/><path d="M612.6 881.85H646.8" stroke="#8c947c"/><path d="M612.6 887.7H646.8" stroke="#8c947c"/><path d="M612.6 893.55H646.8" stroke="#8c947c"/><path d="M612.6 899.4H646.8" stroke="#8c947c"/><path d="M612.6 905.25H646.8" stroke="#8c947c"/><path d="M612.6 911.0999999999999H646.8" stroke="#8c947c"/><path d="M612.6 916.9499999999999H646.8" stroke="#8c947c"/><path d="M612.6 922.8H646.8" stroke="#8c947c"/><path d="M612.6 928.6499999999999H646.8" stroke="#8c947c"/><path d="M612.6 934.4999999999999H646.8" stroke="#8c947c"/><path d="M612.6 940.3499999999999H646.8" stroke="#8c947c"/><path d="M612.6 946.1999999999998H646.8" stroke="#8c947c"/><path d="M612.6 952.05H646.8" stroke="#8c947c"/><path d="M612.6 957.8999999999999H646.8" stroke="#8c947c"/><path d="M612.6 963.7499999999999H646.8" stroke="#8c947c"/><path d="M612.6 969.5999999999998H646.8" stroke="#8c947c"/><g transform="rotate(-12 629.7 1011)" fill="#304b3c" font-size="10" text-anchor="middle"><text x="629.7" y="1002.5">PUBLIC STAIR</text><text x="629.7" y="1019.5">WEST SIDE ONLY</text></g><rect x="490.65" y="727.5" width="2.6999999999999744" height="63" fill="#728276" stroke="#59745d" stroke-width