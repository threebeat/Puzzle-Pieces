<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1390" viewBox="0 0 1200 1390"><title>Puzzle Pieces — Option B, mezzanine</title><desc>North is up. The hall axis tilts twelve degrees east of north. Open gallery shells are green, closed routes are hatched, future growth is dashed.</desc><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#dddcd0"/><path d="M0 0V8" stroke="#b2b7a8" stroke-width="2"/></pattern></defs><rect width="1200" height="1390" fill="#f2f0e6"/><g font-family="Arial,sans-serif" fill="#304b3c"><text x="55" y="65" font-size="17" letter-spacing="4">PUZZLE PIECES / DESIGN NOTEBOOK</text><text x="55" y="112" font-family="Georgia,serif" font-size="35">The west mezzanine</text><text x="55" y="147" font-size="13" letter-spacing="1.2">OPTION B — THE RETURNING WING · ALTERNATIVE ONLY</text><path d="M55 172H1145" stroke="#aeb8a4"/><path d="M1100 290V207l-10 20m10-20 10 20" stroke="#304b3c" stroke-width="2" fill="none"/><text x="1100" y="198" text-anchor="middle" font-size="14">N</text><text x="1080" y="317" text-anchor="middle" font-size="10">TRUE NORTH</text><g transform="rotate(12 600 660)"><rect x="664.8" y="506.1" width="162" height="453.59999999999997" fill="#e6e5da" stroke="#a8b19f" stroke-width="2" stroke-dasharray="6 5"/><g transform="rotate(-12 745.8 732.9)" fill="#8f9b88" font-size="14" text-anchor="middle"><text x="745.8" y="715.9">OPEN TO</text><text x="745.8" y="732.9">MAIN HALL</text><text x="745.8" y="749.9">BELOW</text></g><rect x="389.4" y="619.5" width="259.2" height="72.89999999999999" fill="none" stroke="#91a18b" stroke-width="1.5" stroke-dasharray="6 5"/><g transform="rotate(-12 519 655.95)" fill="#7c9076" font-size="9" text-anchor="middle"><text x="519" y="655.95">UPPER GALLERY RESERVE</text></g><rect x="664.8" y="522.3" width="32.4" height="437.4" fill="#d2d9c6" stroke="#59745d" stroke-width="2" /><g transform="rotate(-12 681 635.7)" fill